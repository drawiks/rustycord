[package]
name = "rustycord-discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Discord user account protocol client (REST + gateway)"

[dependencies]
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
iana-time-zone = "0.1"
rand = "0.9"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
urlencoding = "2"
wreq = { version = "=0.16.3", features = ["json", "cookies", "gzip", "brotli", "deflate", "multipart", "stream"] }
wreq-util = "=0.2.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
