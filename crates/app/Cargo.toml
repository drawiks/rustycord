[package]
name = "rustycord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Discord client for Linux"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
dirs = "7"
futures = "0.3"
gpui-kit = "=0.11.0"
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
mimalloc = { version = "0.1", default-features = false }
keyring = "4"
open = "5"
rustycord-discord = { path = "../discord" }
rustycord-voice = { path = "../voice" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wreq = "=0.16.3"
wreq-util = "=0.2.0"
