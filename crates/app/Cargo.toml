[package]
name = "rustycord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Discord client for Linux"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
futures = "0.3"
gpui-kit = "=0.11.0"
http = "1"
rustycord-discord = { path = "../discord" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
wreq = "=0.16.3"
wreq-util = "=0.2.0"
